<app-page-header title="Mis requerimientos" subtitle="Consulta, envía y revisa tus solicitudes">
  <ng-container actions>
    <button mat-flat-button class="btn-primary" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nuevo requerimiento
    </button>
  </ng-container>
</app-page-header>

<div class="card filters">
  <mat-form-field appearance="outline">
    <mat-label>Número</mat-label>
    <input matInput [formControl]="fNumero" (keyup.enter)="buscar()" placeholder="REQ-000001" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="fEstado">
      <mat-option value="">Todos</mat-option>
      <mat-option *ngFor="let e of estados" [value]="e">{{ e }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Desde</mat-label>
    <input matInput type="date" [formControl]="fDesde" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Hasta</mat-label>
    <input matInput type="date" [formControl]="fHasta" />
  </mat-form-field>
  <button mat-flat-button class="btn-primary" (click)="buscar()"><mat-icon>search</mat-icon> Filtrar</button>
  <button mat-stroked-button (click)="limpiar()">Limpiar</button>
</div>

<div class="card" *ngIf="page(); else loadingTpl">
  <app-empty-state
    *ngIf="page()!.content.length === 0"
    title="Sin requerimientos"
    subtitle="No se encontraron resultados con los filtros actuales."
  />
  <table mat-table [dataSource]="page()!.content" class="payload-table" *ngIf="page()!.content.length > 0">
    <ng-container matColumnDef="numero">
      <th mat-header-cell *matHeaderCellDef>N°</th>
      <td mat-cell *matCellDef="let r" class="text-primary">{{ r.numero }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let r">{{ r.descripcion }}</td>
    </ng-container>
    <ng-container matColumnDef="proveedor">
      <th mat-header-cell *matHeaderCellDef>Proveedor</th>
      <td mat-cell *matCellDef="let r">{{ r.proveedor.name }}</td>
    </ng-container>
    <ng-container matColumnDef="moneda">
      <th mat-header-cell *matHeaderCellDef>Moneda</th>
      <td mat-cell *matCellDef="let r">{{ r.moneda }}</td>
    </ng-container>
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let r"><app-status-chip [estado]="r.estado" /></td>
    </ng-container>
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef>Actualizado</th>
      <td mat-cell *matCellDef="let r">{{ fecha(r.updatedAt) }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let r">
        <button mat-button class="text-primary" (click)="ver(r.id)">Ver detalle</button>
        <button mat-stroked-button class="btn-primary" *ngIf="r.estado === 'BORRADOR'" (click)="enviar(r)">Enviar</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
  <mat-paginator
    [length]="page()!.totalElements"
    [pageSize]="page()!.size"
    [pageIndex]="page()!.page"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="cargar($event.pageIndex, $event.pageSize)"
  />
</div>

<ng-template #loadingTpl>
  <div class="card" style="display:flex;justify-content:center;padding:40px;">
    <mat-spinner diameter="40" *ngIf="loading()" />
  </div>
</ng-template>
