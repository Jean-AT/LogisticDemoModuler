<app-page-header title="Maestros · Ítems" subtitle="Catálogo de ítems para requerimientos">
  <ng-container actions>
    <button mat-flat-button class="btn-primary" (click)="toggleForm()">
      <mat-icon>{{ showForm() ? 'close' : 'add' }}</mat-icon>
      {{ showForm() ? 'Cancelar' : 'Nuevo ítem' }}
    </button>
  </ng-container>
</app-page-header>

<div class="form-card card" *ngIf="showForm()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <mat-form-field appearance="outline"><mat-label>Código</mat-label><input matInput formControlName="code" placeholder="ITM-004" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Nombre</mat-label><input matInput formControlName="name" /></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>Unidad de medida</mat-label><input matInput formControlName="unitMeasure" placeholder="UND" /></mat-form-field>
      <button mat-flat-button class="btn-primary" type="submit" [disabled]="form.invalid || saving()">Guardar</button>
    </div>
  </form>
</div>

<div class="card" *ngIf="!loading(); else loadingTpl">
  <app-empty-state *ngIf="items().length === 0" title="Sin ítems" subtitle="Aún no hay ítems registrados." icon="inventory_2" />
  <table mat-table [dataSource]="items()" class="payload-table" *ngIf="items().length > 0">
    <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef>Código</th><td mat-cell *matCellDef="let it" class="text-primary">{{ it.code }}</td></ng-container>
    <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Nombre</th><td mat-cell *matCellDef="let it">{{ it.name }}</td></ng-container>
    <ng-container matColumnDef="unit"><th mat-header-cell *matHeaderCellDef>Unidad</th><td mat-cell *matCellDef="let it">{{ it.unitMeasure }}</td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

<ng-template #loadingTpl>
  <div class="card" style="display:flex;justify-content:center;padding:40px;"><mat-spinner diameter="40" /></div>
</ng-template>
