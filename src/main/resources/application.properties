spring.application.name=logistica-demo

server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_demo}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=logistica_demo
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.com.logistica.demo=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-}]

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

demo.finance.igv-rate=0.18
demo.finance.exchange-rate=3.35
demo.report.company-name=${DEMO_REPORT_COMPANY_NAME:Logistica Demo SAC}

demo.jwt.secret=${DEMO_JWT_SECRET}
demo.jwt.issuer=${DEMO_JWT_ISSUER:logistica-demo}
demo.jwt.expiration-ms=${DEMO_JWT_EXPIRATION_MS:3600000}
demo.jwt.refresh-expiration-ms=${DEMO_JWT_REFRESH_EXPIRATION_MS:28800000}

demo.cors.allowed-origins=${DEMO_CORS_ALLOWED_ORIGINS:http://localhost:4200}
