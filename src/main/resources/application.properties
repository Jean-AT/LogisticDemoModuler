spring.application.name=logistica-demo

server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=logistica_demo
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.flyway.enabled=false

spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.com.logistica.demo=DEBUG

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

demo.finance.igv-rate=0.18
demo.finance.exchange-rate=3.35
demo.report.company-name=Logistica Demo SAC

demo.jwt.secret=logistica-demo-cambiar-este-secreto-jwt-de-32-bytes-minimo
demo.jwt.expiration-ms=3600000
