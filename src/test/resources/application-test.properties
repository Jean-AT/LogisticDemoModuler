spring.datasource.url=jdbc:h2:mem:logistica-demo;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH;INIT=CREATE SCHEMA IF NOT EXISTS logistica_demo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=logistica_demo
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false
spring.sql.init.mode=always

logging.level.com.logistica.demo=INFO

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

demo.finance.igv-rate=0.18
demo.finance.exchange-rate=3.35
demo.jwt.secret=0123456789abcdef0123456789abcdef
demo.jwt.issuer=logistica-demo-test
demo.jwt.expiration-ms=3600000
demo.jwt.refresh-expiration-ms=28800000
